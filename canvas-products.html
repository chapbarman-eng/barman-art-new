<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>۵۰ تابلو بوم مخمل | مجتمع چاپ بارمان</title>
<style>
:root{--sage:#a8b7a0;--bone:#f8f5ec;--ink:#26352d;--copper:#b67a53}
*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,#dce4d5,#f8f5ec);padding:26px 16px;text-align:center;border-bottom:1px solid #d8ddcf}
h1{margin:0 0 8px;font-size:clamp(22px,4vw,34px)}.sub{margin:0;color:#566454}
main{max-width:1200px;margin:auto;padding:18px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
input{font:inherit;border:1px solid #d3d8cd;border-radius:12px;background:white;padding:12px;min-width:190px;flex:1}
.status{padding:12px;border-radius:12px;background:#fff;border:1px solid #e6e4db;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:white;border:1px solid #e7e4da;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.photo{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f2f0e8;border-radius:11px}
.placeholder{width:100%;aspect-ratio:1/1;display:grid;place-items:center;background:#f2f0e8;border-radius:11px;font-size:48px}
.name{font-weight:700;line-height:1.8}.meta{font-size:12px;color:#657064}.price{font-weight:700;color:#8c5a38;margin-top:auto}
button,.buy{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--sage);color:#203025;cursor:pointer;text-align:center;text-decoration:none;display:block}
.buy{background:#26352d;color:#fff}.toplink{display:block;max-width:600px;margin:18px auto 0;text-decoration:none;background:#fff;border:1px solid #d8ddcf;border-radius:14px;padding:13px 18px;font-weight:700;color:#26352d}
footer{text-align:center;padding:24px;color:#657064}
</style>
</head>
<body>
<header><h1>۵۰ تابلو بوم مخمل بارمان</h1><p class="sub">منتخب محصولات مجتمع چاپ بارمان در دیجی‌کالا</p><a class="toplink" href="https://www.digikala.com/seller/C6YT6/#products" target="_blank" rel="noopener">مشاهده همه محصولات بارمان در دیجی‌کالا</a></header>
<main>
<div class="controls"><input id="q" type="search" placeholder="جست‌وجو بین ۵۰ تابلو بر اساس نام یا کد محصول…"></div>
<div id="status" class="status">در حال بارگذاری ۵۰ تابلو بوم…</div><div id="grid" class="grid"></div>
</main>
<footer>مجتمع چاپ بارمان · <a href="https://www.instagram.com/chap.barman/" target="_blank" rel="noopener">اینستاگرام chap.barman</a></footer>
<script>
const DATA_URL='./canvas-products.json';let all=[],filtered=[];
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const q=document.getElementById('q'),grid=document.getElementById('grid'),status=document.getElementById('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageOf(p){return p.imageUrl||p.image||p.image_url||p.thumbnail||p.mainImage||p.imageURL||''}
function buyUrl(p){const code=p.digikalaProductCode||p.productCode||p.dkp||'';return code?'https://www.digikala.com/product/dkp-'+encodeURIComponent(code)+'/':'https://www.digikala.com/seller/C6YT6/#products'}
function render(){grid.innerHTML=filtered.map((p,i)=>{const img=imageOf(p),title=p.title||p.name||'تابلو بوم مخمل بارمان';return '<article class="card">'+(img?'<img class="photo" loading="lazy" src="'+esc(img)+'" alt="'+esc(title)+'" onerror="this.outerHTML=\'<div class=&quot;placeholder&quot;>🖼️</div>\'">':'<div class="placeholder">🖼️</div>')+'<div class="name">'+esc(title)+'</div><div class="meta">کد محصول: '+esc(p.digikalaProductCode||p.productCode||p.id||'—')+'</div><div class="price">'+(p.priceToman?fa(p.priceToman)+' تومان':p.price?esc(p.price):'قیمت در دیجی‌کالا بررسی شود')+'</div><a class="buy" href="'+buyUrl(p)+'" target="_blank" rel="noopener">مشاهده و خرید در دیجی‌کالا</a></article>'}).join('');status.textContent='نمایش '+fa(filtered.length)+' محصول از ۵۰ تابلو بوم منتخب.'}
function filter(){const term=q.value.trim().toLocaleLowerCase();filtered=all.filter(p=>!term||String(p.title||p.name||'').toLocaleLowerCase().includes(term)||String(p.digikalaProductCode||p.productCode||p.id||'').includes(term));render()}
q.addEventListener('input',filter);
fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{const rows=Array.isArray(data)?data:(data.products||data.items||[]);all=rows.filter(p=>p.active!==false).slice(0,50);filtered=all;render()}).catch(e=>{status.textContent='بارگذاری فهرست تابلوها انجام نشد. لطفاً بعداً دوباره تلاش کنید.'});
</script>
</body></html>
