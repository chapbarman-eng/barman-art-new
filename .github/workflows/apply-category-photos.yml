name: Apply category photos to homepage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-category-photos.yml'
      - 'category-images.js'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage photo script and bypass browser cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          tag = '<script src="./category-images.js?v=' + os.environ.get("GITHUB_SHA", "latest") + '" defer></script>'
          html, count = re.subn(r'<script\\b[^>]*src=["\'][^"\']*category-images\\.js[^"\']*["\'][^>]*></script>', tag, html, flags=re.I)
          if count == 0:
              marker = "</body>"
              pos = html.lower().rfind(marker)
              if pos < 0:
                  raise SystemExit("Could not safely locate </body>; leaving homepage unchanged.")
              html = html[:pos] + tag + "\\n" + html[pos:]
          p.write_text(html, encoding="utf-8")
          PY
      - name: Commit and push homepage injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage script already refreshed."
          else
            git commit -m "Refresh category image script cache version"
            git push
          fi
